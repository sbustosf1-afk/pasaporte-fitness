<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasaporte Fitness NFC</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #101510;
  color: white;
  font-family: Arial, sans-serif;
}

.card {
  width: 100%;
  max-width: 430px;
  padding: 30px 22px;
  background: #1d2b20;
  border: 1px solid #354b38;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 10px 35px rgba(0,0,0,.35);
}

.logo {
  font-size: 38px;
  margin-bottom: 12px;
}

h1 {
  color: #b6f36b;
  font-size: 27px;
  margin: 8px 0;
}

.subtitulo {
  color: #c6d4c6;
  font-size: 14px;
  margin-bottom: 25px;
}

.estacion {
  background: #304832;
  color: #b6f36b;
  padding: 13px;
  border-radius: 10px;
  font-weight: bold;
  margin-bottom: 25px;
}

.instruccion {
  font-size: 17px;
  line-height: 1.5;
  margin: 20px 0;
}

button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 17px;
  background: #b6f36b;
  color: #142015;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.estado {
  margin-top: 22px;
  padding: 15px;
  background: #142017;
  border-radius: 10px;
  color: #d8e6d8;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.resultado {
  margin-top: 15px;
  color: #b6f36b;
  font-weight: bold;
  line-height: 1.6;
}

.pie {
  color: #829482;
  font-size: 11px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">🏅</div>

  <h1>PASAPORTE FITNESS</h1>

  <div class="subtitulo">
    Sistema de registro de participantes NFC
  </div>

  <div class="estacion" id="nombreEstacion">
    CARGANDO ESTACIÓN...
  </div>

  <div class="instruccion">
    Acerca tu tarjeta NFC al teléfono para registrar tu participación.
  </div>

  <button id="boton" onclick="iniciarLector()">
    INICIAR LECTOR NFC
  </button>

  <div class="estado" id="estado">
    Esperando para iniciar el lector...
  </div>

  <div class="resultado" id="resultado"></div>

  <div class="pie">
    PASAPORTE FITNESS · REGISTRO DIGITAL
  </div>

</div>

<script>

// ======================================
// CONFIGURACIÓN
// ======================================

const API = "https://script.google.com/macros/s/AKfycbx1sJBxlPMIZBrqCYdqfkjRAwzyoTq-wGytKybyU0giKwwb9tw73kSH5tUdluOhoiv1AA/exec";

const TOKEN = "FITNESS2026";

// ======================================
// ESTACIÓN
// ======================================

const parametros = new URLSearchParams(window.location.search);

const estacion = (parametros.get("station") || "")
  .trim()
  .toUpperCase();

const estacionesValidas = [
  "COORDINACION",
  "FUERZA",
  "MOVIMIENTO",
  "BIENESTAR"
];

const nombreEstacion = document.getElementById("nombreEstacion");
const estado = document.getElementById("estado");
const resultado = document.getElementById("resultado");
const boton = document.getElementById("boton");

if (estacionesValidas.includes(estacion)) {
  nombreEstacion.textContent = estacion;
} else {
  nombreEstacion.textContent = "ESTACIÓN NO CONFIGURADA";
  boton.disabled = true;
  estado.textContent =
    "Error: la dirección no contiene una estación válida.";
}

// ======================================
// VARIABLES DEL LECTOR
// ======================================

let lectorActivo = false;
let procesando = false;

// ======================================
// OBTENER BYTES NFC
// ======================================

function obtenerBytes(record) {

  const data = record.data;

  if (!data) {
    return new Uint8Array();
  }

  if (data instanceof DataView) {
    return new Uint8Array(
      data.buffer,
      data.byteOffset,
      data.byteLength
    );
  }

  if (data instanceof ArrayBuffer) {
    return new Uint8Array(data);
  }

  if (ArrayBuffer.isView(data)) {
    return new Uint8Array(
      data.buffer,
      data.byteOffset,
      data.byteLength
    );
  }

  return new Uint8Array();
}

// ======================================
// EXTRAER CÓDIGO DE LA TARJETA
// ======================================

function obtenerCodigo(record) {

  if (record.recordType !== "text") {
    throw new Error("La tarjeta no contiene un registro de texto.");
  }

  const bytes = obtenerBytes(record);

  if (bytes.length === 0) {
    throw new Error("La tarjeta no contiene datos.");
  }

  const decodificador = new TextDecoder("utf-8");

  // Primero intenta leer el contenido directamente.
  let texto = decodificador.decode(bytes).trim();

  // Si no es un código válido, intenta interpretar
  // el formato estándar NDEF Text RTD.
  if (!/^P\d{3,}$/i.test(texto)) {

    const longitudIdioma = bytes[0] & 0x3F;
    const inicioTexto = 1 + longitudIdioma;

    if (bytes.length <= inicioTexto) {
      throw new Error("No se encontró texto en la tarjeta.");
    }

    texto = decodificador
      .decode(bytes.slice(inicioTexto))
      .trim();
  }

  texto = texto
    .replace(/[\u0000-\u001F\u007F]/g, "")
    .trim()
    .toUpperCase();

  if (!/^P\d{3,}$/.test(texto)) {
    throw new Error(
      "Código NFC no válido. Contenido leído: " + texto
    );
  }

  return texto;
}

// ======================================
// ENVIAR REGISTRO A GOOGLE SHEETS
// ======================================

function enviarRegistro(codigo) {

  return new Promise((resolve, reject) => {

    const callback = "fitnessCallback_" +
      Date.now() + "_" +
      Math.floor(Math.random() * 100000);

    const parametros = new URLSearchParams();

    parametros.set("token", TOKEN);
    parametros.set("codigo", codigo);
    parametros.set("estacion", estacion);
    parametros.set("callback", callback);

    const script = document.createElement("script");

    let terminado = false;

    const tiempoLimite = setTimeout(() => {
      finalizar();
      reject(new Error(
        "Tiempo de espera agotado. No se recibió respuesta de Google Sheets."
      ));
    }, 15000);

    function finalizar() {

      if (terminado) return;

      terminado = true;

      clearTimeout(tiempoLimite);

      delete window[callback];

      script.remove();
    }

    window[callback] = function(respuesta) {

      finalizar();

      if (!respuesta) {
        reject(new Error("Respuesta vacía del servidor."));
        return;
      }

      resolve(respuesta);
    };

    script.onerror = function() {

      finalizar();

      reject(new Error(
        "No fue posible conectar con Google Apps Script."
      ));
    };

    script.src = API + "?" + parametros.toString();

    document.body.appendChild(script);

  });
}

// ======================================
// PROCESAR TARJETA
// ======================================

async function procesarTarjeta(message) {

  if (procesando) return;

  procesando = true;

  try {

    estado.textContent = "Tarjeta detectada. Analizando...";
    resultado.textContent = "";

    if (!message.records || message.records.length === 0) {
      throw new Error("La tarjeta no contiene registros.");
    }

    let codigo = null;

    for (const record of message.records) {

      if (record.recordType === "text") {
        codigo = obtenerCodigo(record);
        break;
      }
    }

    if (!codigo) {
      throw new Error("No se encontró un código de participante.");
    }

    const bytes = obtenerBytes(message.records.find(
      record => record.recordType === "text"
    ));

    estado.textContent =
      "Código detectado: " + codigo +
      "\nEnviando registro a Google Sheets...";

    const respuesta = await enviarRegistro(codigo);

    if (respuesta.ok) {

      estado.textContent = "REGISTRO EXITOSO";

      resultado.textContent =
        "Participante: " + respuesta.nombre +
        "\nCódigo: " + respuesta.codigo +
        "\nEstación: " + respuesta.estacion +
        "\nEstado: " + respuesta.estado;

    } else {

      estado.textContent = respuesta.mensaje ||
        "No fue posible registrar al participante.";

      resultado.textContent = "";
    }

  } catch (error) {

    estado.textContent = "Error: " + error.message;

    resultado.textContent = "";

  } finally {

    procesando = false;

  }
}

// ======================================
// INICIAR LECTOR NFC
// ======================================

async function iniciarLector() {

  if (!estacionesValidas.includes(estacion)) {
    estado.textContent = "Configura una estación válida.";
    return;
  }

  if (!("NDEFReader" in window)) {
    estado.textContent =
      "Este navegador no permite utilizar Web NFC. Abre la página en Chrome desde Android.";
    return;
  }

  if (lectorActivo) {
    estado.textContent = "El lector NFC ya está activo.";
    return;
  }

  try {

    const lector = new NDEFReader();

    await lector.scan();

    lectorActivo = true;

    boton.disabled = true;

    boton.textContent = "LECTOR ACTIVO";

    estado.textContent =
      "Lector activo. Acerca tu tarjeta NFC.";

    lector.onreading = async (evento) => {

      await procesarTarjeta(evento.message);

    };

    lector.onreadingerror = () => {

      estado.textContent =
        "No fue posible leer la tarjeta. Intenta nuevamente.";

    };

  } catch (error) {

    estado.textContent =
      "Error al iniciar el lector: " + error.message;

    boton.disabled = false;

    boton.textContent = "REINTENTAR LECTOR NFC";

  }
}

</script>

</body>
</html>
