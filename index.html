<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasaporte Fitness NFC</title>

<style>
body {
  background: #101510;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px;
}

.card {
  background: #1d2b20;
  padding: 25px;
  border-radius: 15px;
  max-width: 450px;
  margin: auto;
}

h1 {
  color: #8bd58b;
}

select, button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

button {
  background: #55b85b;
  color: white;
  font-weight: bold;
}

#estado {
  margin-top: 20px;
  padding: 15px;
  background: #101510;
  border-radius: 8px;
  overflow-wrap: anywhere;
}

#codigo {
  font-size: 22px;
  color: #8bd58b;
  font-weight: bold;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="card">

<h1>Pasaporte Fitness</h1>
<p>Acerca tu tarjeta NFC para registrar tu estación.</p>

<label for="estacion">Selecciona la estación:</label>

<select id="estacion">
  <option value="COORDINACION">COORDINACIÓN</option>
  <option value="FUERZA">FUERZA</option>
  <option value="MOVIMIENTO">MOVIMIENTO</option>
  <option value="BIENESTAR">BIENESTAR</option>
</select>

<button id="activar">ACTIVAR LECTOR NFC</button>

<div id="estado">Lector NFC apagado.</div>

<div id="codigo"></div>

</div>

<script>

// =====================================
// CONFIGURACIÓN
// =====================================

const API_URL = "https://script.google.com/macros/s/AKfycbx1sJBxlPMIZBrqCYdqfkjRAwzyoTq-wGytKybyU0giKwwb9tw73kSH5tUdluOhoiv1AA/exec";

const API_TOKEN = "FITNESS2026";

// =====================================
// ELEMENTOS DE LA PANTALLA
// =====================================

const estado = document.getElementById("estado");
const codigoPantalla = document.getElementById("codigo");
const boton = document.getElementById("activar");
const selectorEstacion = document.getElementById("estacion");

let lector = null;
let leyendo = false;

// =====================================
// MOSTRAR MENSAJES
// =====================================

function mostrar(mensaje) {
  estado.textContent = mensaje;
}

// =====================================
// LEER CONTENIDO NFC
// =====================================

function obtenerCodigo(record) {

  if (!record.data) {
    throw new Error("El registro NFC no contiene datos.");
  }

  const datos = record.data;

  const bytes = new Uint8Array(
    datos.buffer,
    datos.byteOffset,
    datos.byteLength
  );

  console.log("TIPO:", record.recordType);
  console.log("BYTES:", Array.from(bytes));

  if (bytes.length === 0) {
    throw new Error("La tarjeta no contiene bytes.");
  }

  if (record.recordType === "text") {

    const longitudIdioma = bytes[0] & 0x3F;
    const inicioTexto = 1 + longitudIdioma;

    return new TextDecoder("utf-8")
      .decode(bytes.slice(inicioTexto))
      .trim()
      .toUpperCase();
  }

  return new TextDecoder("utf-8")
    .decode(bytes)
    .trim()
    .toUpperCase();
}

// =====================================
// VALIDAR CÓDIGO
// =====================================

function validarCodigo(codigo) {
  return /^P\d{3,}$/.test(codigo);
}

// =====================================
// CONECTAR CON GOOGLE SHEETS
// =====================================

function registrarEnGoogle(codigo, estacion) {

  return new Promise((resolve, reject) => {

    const nombreCallback =
      "respuestaPasaporte_" + Date.now();

    const script = document.createElement("script");

    const url = new URL(API_URL);

    url.searchParams.set("accion", "registrar");
    url.searchParams.set("codigo", codigo);
    url.searchParams.set("estacion", estacion);
    url.searchParams.set("token", API_TOKEN);
    url.searchParams.set("callback", nombreCallback);

    window[nombreCallback] = function(respuesta) {

      resolve(respuesta);

      delete window[nombreCallback];
      script.remove();

    };

    script.onerror = function() {

      delete window[nombreCallback];
      script.remove();

      reject(new Error("No se pudo conectar con Google Sheets."));

    };

    script.src = url.toString();

    document.body.appendChild(script);

  });

}

// =====================================
// PROCESAR REGISTROS NFC
// =====================================

async function procesarTarjeta(mensaje) {

  mostrar("TARJETA DETECTADA. ANALIZANDO...");
  codigoPantalla.textContent = "";

  console.log("MENSAJE NFC:", mensaje);

  if (!mensaje || !mensaje.records) {
    mostrar("El mensaje NFC no contiene registros.");
    return;
  }

  if (mensaje.records.length === 0) {
    mostrar("La tarjeta fue detectada, pero no tiene registros.");
    return;
  }

  mostrar("REGISTROS ENCONTRADOS: " + mensaje.records.length);

  for (const record of mensaje.records) {

    try {

      const codigo = obtenerCodigo(record);

      console.log("CÓDIGO LEÍDO:", codigo);

      if (!codigo) {
        mostrar("La tarjeta no contiene texto.");
        continue;
      }

      codigoPantalla.textContent = codigo;

      if (!validarCodigo(codigo)) {

        mostrar(
          "Contenido leído: " + codigo +
          ". No es un código válido."
        );

        continue;
      }

      mostrar("Código detectado: " + codigo + ". Registrando...");

      const respuesta = await registrarEnGoogle(
        codigo,
        selectorEstacion.value
      );

      console.log("RESPUESTA DEL SERVIDOR:", respuesta);

      mostrar(
        respuesta.mensaje ||
        respuesta.message ||
        "Respuesta recibida de Google Sheets."
      );

      return;

    } catch (error) {

      console.error("ERROR:", error);

      mostrar("ERROR: " + error.message);

    }

  }

}

// =====================================
// ACTIVAR LECTOR NFC
// =====================================

async function activarLector() {

  if (!("NDEFReader" in window)) {

    mostrar(
      "Este navegador no permite leer NFC. " +
      "Abre la página en Google Chrome desde Android."
    );

    return;
  }

  if (leyendo) {
    mostrar("El lector ya está activo. Acerca tu tarjeta.");
    return;
  }

  try {

    lector = new NDEFReader();

    // Activar lectura NFC
    await lector.scan();

    leyendo = true;

    mostrar("Lector activo. Acerca tu tarjeta.");

    // CORRECCIÓN: procesar evento.message

    lector.onreading = async function(evento) {

      console.log("EVENTO NFC:", evento);
      console.log("MENSAJE NFC:", evento.message);
      console.log("REGISTROS NFC:", evento.message?.records);

      if (!evento.message) {
        mostrar("El evento NFC llegó sin mensaje.");
        return;
      }

      if (
        !evento.message.records ||
        evento.message.records.length === 0
      ) {
        mostrar("Evento recibido, pero sin registros.");
        return;
      }

      await procesarTarjeta(evento.message);

    };

    lector.onerror = function(evento) {

      console.error("ERROR NFC:", evento);

      mostrar("Error del lector NFC. Intenta activarlo nuevamente.");

      leyendo = false;
    };

  } catch (error) {

    console.error(error);

    mostrar("No se pudo activar NFC: " + error.message);

    leyendo = false;
  }

}

// =====================================
// BOTÓN
// =====================================

boton.addEventListener("click", activarLector);

</script>

</body>
</html>
