<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasaporte Fitness NFC</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background: #101510;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
  margin: 0;
}

.container {
  max-width: 480px;
  margin: 30px auto;
  background: #1d2b20;
  padding: 25px;
  border-radius: 18px;
}

h1 {
  color: #a5e6a5;
}

p {
  line-height: 1.5;
}

select, button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border-radius: 9px;
  border: none;
  font-size: 16px;
}

select {
  background: white;
  color: #111;
}

button {
  background: #a5e6a5;
  color: #102010;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.estado {
  background: #101510;
  border-radius: 10px;
  padding: 18px;
  margin-top: 20px;
  min-height: 65px;
  overflow-wrap: anywhere;
}

.codigo {
  font-size: 25px;
  color: #a5e6a5;
  font-weight: bold;
}

.instruccion {
  color: #c7d4c7;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<h1>PASAPORTE FITNESS</h1>

<p>Bienvenido al sistema de registro de experiencias.</p>

<p>Selecciona la estación correspondiente.</p>

<select id="estacion">
  <option value="COORDINACION">COORDINACIÓN</option>
  <option value="FUERZA">FUERZA</option>
  <option value="MOVIMIENTO">MOVIMIENTO</option>
  <option value="BIENESTAR">BIENESTAR</option>
</select>

<button id="iniciar">ACTIVAR LECTOR NFC</button>

<div class="estado" id="estado">
Lector NFC detenido.
</div>

<p class="instruccion">
Acerca tu tarjeta NFC a la parte posterior del celular.
</p>

<div class="codigo" id="codigo"></div>

</div>

<script>

/**************** CONFIGURACIÓN ****************/

const API_URL = "https://script.google.com/macros/s/AKfycbx1sJBxlPMIZBrqCYdqfkjRAwzyoTq-wGytKybyU0giKwwb9tw73kSH5tUdluOhoiv1AA/exec";
const API_TOKEN = "FITNESS2026";

/**************** ELEMENTOS ****************/

const boton = document.getElementById("iniciar");
const estado = document.getElementById("estado");
const codigoPantalla = document.getElementById("codigo");
const estacion = document.getElementById("estacion");

let lectorActivo = false;
let procesando = false;

/**************** MENSAJES ****************/

function mostrar(mensaje) {
  estado.textContent = mensaje;
}

/**************** LEER TEXTO NFC ****************/

async function obtenerCodigo(record) {

  console.log("TIPO:", record.recordType);
  console.log("MIME:", record.mediaType);
  console.log("RECORD:", record);

  try {

    if (record.recordType === "text") {

      const texto = await record.text();

      console.log("TEXTO NFC:", texto);

      return texto.trim().toUpperCase();
    }

    if (record.recordType === "url") {

      const texto = await record.text();

      console.log("URL NFC:", texto);

      return texto.trim().toUpperCase();
    }

    if (record.data) {

      const bytes = new Uint8Array(
        record.data.buffer,
        record.data.byteOffset,
        record.data.byteLength
      );

      console.log("BYTES:", Array.from(bytes));

      const texto = new TextDecoder(
        "utf-8"
      ).decode(bytes);

      console.log("CONTENIDO:", texto);

      return texto.trim().toUpperCase();
    }

  } catch (error) {

    console.error("ERROR DE LECTURA:", error);

  }

  return "";
}

/**************** VALIDAR PARTICIPANTE ****************/

function validarCodigo(codigo) {
  return /^P\d{3,}$/.test(codigo);
}

/**************** ENVIAR A GOOGLE SHEETS ****************/

function enviarRegistro(codigo, nombreEstacion) {

  return new Promise((resolve, reject) => {

    const callback =
      "respuestaNFC_" + Date.now() + "_" +
      Math.floor(Math.random() * 10000);

    const parametros = new URLSearchParams({
      accion: "registrar",
      codigo: codigo,
      estacion: nombreEstacion,
      token: API_TOKEN,
      callback: callback
    });

    const script = document.createElement("script");

    const tiempo = setTimeout(() => {
      delete window[callback];
      script.remove();
      reject(new Error("Tiempo de espera agotado."));
    }, 15000);

    window[callback] = function(respuesta) {

      clearTimeout(tiempo);
      delete window[callback];
      script.remove();

      resolve(respuesta);
    };

    script.onerror = function() {

      clearTimeout(tiempo);
      delete window[callback];
      script.remove();

      reject(
        new Error("No se pudo conectar con Google Sheets.")
      );
    };

    script.src = API_URL + "?" + parametros.toString();

    document.body.appendChild(script);
  });
}

/**************** PROCESAR TARJETA ****************/

async function procesarTarjeta(mensaje) {

  mostrar("TARJETA DETECTADA. ANALIZANDO...");

  codigoPantalla.textContent = "";

  console.log("MENSAJE NFC:", mensaje);

  for (const record of mensaje.records) {

    console.log("TIPO:", record.recordType);
    console.log("MIME:", record.mediaType);
    console.log("ID:", record.id);

    try {

      if (record.recordType === "text") {

        const texto = await record.text();

        console.log("TEXTO:", texto);

        mostrar("TEXTO DETECTADO: " + texto);

        codigoPantalla.textContent = texto;

      } else if (record.data) {

        const bytes = new Uint8Array(
          record.data.buffer,
          record.data.byteOffset,
          record.data.byteLength
        );

        console.log("BYTES:", Array.from(bytes));

        const contenido = new TextDecoder(
          "utf-8"
        ).decode(bytes);

        console.log("CONTENIDO:", contenido);

        mostrar("CONTENIDO: " + contenido);

        codigoPantalla.textContent = contenido;

      } else {

        mostrar("REGISTRO DETECTADO: " + record.recordType);

      }

    } catch (error) {

      console.error("ERROR:", error);

      mostrar("Error leyendo registro: " + error.message);

    }
  }
}
/**************** ACTIVAR LECTOR NFC ****************/

async function activarNFC() {

  if (lectorActivo) {
    mostrar("El lector NFC ya está activo.");
    return;
  }

  if (!("NDEFReader" in window)) {

    mostrar("Este navegador no admite Web NFC. Utiliza Chrome en Android.");
    return;
  }

  try {

    boton.disabled = true;

    mostrar("Activando lector NFC...");

    const reader = new NDEFReader();

    await reader.scan();

    lectorActivo = true;

    mostrar("Lector activo. Acerca tu tarjeta NFC.");

    reader.onreading = async function(event) {
      await procesarTarjeta(event.message);
    };

    reader.onreadingerror = function() {
      mostrar("No fue posible leer la tarjeta. Intenta nuevamente.");
    };

  } catch (error) {

    boton.disabled = false;

    mostrar("Error al activar NFC: " + error.message);

    console.error(error);
  }
}

/**************** BOTÓN ****************/

boton.addEventListener("click", activarNFC);

</script>

</body>
</html>
