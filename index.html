<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasaporte Fitness NFC</title>

<style>
body {
  background: #101510;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}

.card {
  background: #1d2b20;
  border-radius: 15px;
  padding: 22px;
  max-width: 450px;
  margin: auto;
}

h1 {
  color: #8ee58e;
}

select, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}

button {
  background: #65c76b;
  color: #102010;
  font-weight: bold;
  cursor: pointer;
}

#estado {
  margin-top: 20px;
  padding: 15px;
  background: #26372a;
  border-radius: 8px;
  overflow-wrap: anywhere;
}

#diagnostico {
  margin-top: 12px;
  padding: 12px;
  background: #17231a;
  border-radius: 8px;
  font-size: 13px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="card">

<h1>Pasaporte Fitness NFC</h1>

<p>Acerca tu tarjeta NFC para registrar tu actividad.</p>

<label for="estacion">Selecciona la estación:</label>

<select id="estacion">
  <option value="COORDINACION">COORDINACIÓN</option>
  <option value="FUERZA">FUERZA</option>
  <option value="MOVIMIENTO">MOVIMIENTO</option>
  <option value="BIENESTAR">BIENESTAR</option>
</select>

<button id="iniciar">ACTIVAR LECTOR NFC</button>

<div id="estado">
  Esperando activación del lector...
</div>

<div id="diagnostico">
  Diagnóstico: pendiente
</div>

</div>

<script>

// ==================================
// CONFIGURACIÓN
// ==================================

const API_URL = "https://script.google.com/macros/s/AKfycbx1sJBxlPMIZBrqCYdqfkjRAwzyoTq-wGytKybyU0giKwwb9tw73kSH5tUdluOhoiv1AA/exec";

const API_TOKEN = "FITNESS2026";

// ==================================
// ELEMENTOS DE PANTALLA
// ==================================

const estado = document.getElementById("estado");
const diagnostico = document.getElementById("diagnostico");
const iniciar = document.getElementById("iniciar");
const estacion = document.getElementById("estacion");

// ==================================
// CONVERTIR DATOS NFC EN BYTES
// ==================================

function obtenerBytes(record) {

  const data = record.data;

  if (data instanceof DataView) {
    return new Uint8Array(
      data.buffer,
      data.byteOffset,
      data.byteLength
    );
  }

  if (data instanceof ArrayBuffer) {
    return new Uint8Array(data);
  }

  if (ArrayBuffer.isView(data)) {
    return new Uint8Array(
      data.buffer,
      data.byteOffset,
      data.byteLength
    );
  }

  throw new Error("Formato de datos NFC no reconocido");
}

// ==================================
// OBTENER CÓDIGO DE LA TARJETA
// ==================================

function obtenerCodigo(record) {

  if (record.recordType !== "text") {
    throw new Error(
      "El registro NFC no es de tipo texto: " +
      record.recordType
    );
  }

  const bytes = obtenerBytes(record);

  diagnostico.textContent =
    "TIPO: " + record.recordType +
    " | BYTES: " + Array.from(bytes).join(", ");

  if (bytes.length === 0) {
    throw new Error("La tarjeta no contiene datos");
  }

  // Convertir directamente los bytes en texto
  const texto = new TextDecoder("utf-8").decode(bytes);

  // Limpiar espacios y caracteres invisibles
  const codigo = texto
    .replace(/[\u0000-\u001F\u007F]/g, "")
    .trim()
    .toUpperCase();

  return codigo;
}

// ==================================
// PROCESAR TARJETA
// ==================================

async function procesarTarjeta(message) {

  try {

    estado.textContent = "Tarjeta detectada. Analizando...";

    if (!message || !message.records ||
        message.records.length === 0) {

      throw new Error("La tarjeta no contiene registros");
    }

    const record = message.records[0];

    const codigo = obtenerCodigo(record);

    diagnostico.textContent +=
      " | CÓDIGO EXTRAÍDO: " + codigo;

    // Validar código P
    if (!/^P\d{3,}$/.test(codigo)) {

      estado.textContent =
        "Contenido leído: " + codigo +
        ". No corresponde a un código P válido.";

      return;
    }

    estado.textContent =
      "Código reconocido: " + codigo +
      ". Registrando actividad...";

    await registrarEnGoogle(codigo);

  } catch (error) {

    estado.textContent =
      "Error: " + error.message;

  }

}

// ==================================
// REGISTRAR EN GOOGLE APPS SCRIPT
// ==================================

function registrarEnGoogle(codigo) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "respuestaFitness" + Date.now();

    const script = document.createElement("script");

    const datos = {
      token: API_TOKEN,
      codigo: codigo,
      estacion: estacion.value,
      callback: callbackName
    };

    const parametros = new URLSearchParams(datos);

    window[callbackName] = function(respuesta) {

      delete window[callbackName];
      script.remove();

      if (respuesta && respuesta.success) {

        estado.textContent =
          "¡Registro exitoso! Código: " +
          codigo +
          " | Estación: " +
          estacion.value;

        resolve(respuesta);

      } else {

        const mensaje = respuesta && respuesta.message
          ? respuesta.message
          : "No se pudo confirmar el registro";

        estado.textContent = mensaje;

        reject(new Error(mensaje));
      }
    };

    script.onerror = function() {

      delete window[callbackName];
      script.remove();

      estado.textContent =
        "Error de conexión con Google Sheets.";

      reject(new Error("Error de conexión"));
    };

    script.src =
      API_URL + "?" +
      parametros.toString();

    document.body.appendChild(script);

  });

}

// ==================================
// ACTIVAR LECTOR NFC
// ==================================

iniciar.addEventListener("click", async function() {

  try {

    if (!("NDEFReader" in window)) {

      estado.textContent =
        "Tu navegador no permite Web NFC. Utiliza Chrome en Android.";

      return;
    }

    const lector = new NDEFReader();

    estado.textContent =
      "Solicitando permiso para utilizar NFC...";

    await lector.scan();

    estado.textContent =
      "Lector NFC activo. Acerca tu tarjeta.";

    lector.onreading = function(evento) {

      procesarTarjeta(evento.message);

    };

    lector.onreadingerror = function() {

      estado.textContent =
        "No se pudo leer la tarjeta. Intenta nuevamente.";

    };

  } catch (error) {

    estado.textContent =
      "No se pudo activar el lector: " +
      error.message;

  }

});

</script>

</body>
</html>
